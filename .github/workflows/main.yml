name: Windows Cloud PC Otimizado
on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 360 
    steps:
      - name: Otimizar Performance do Windows
        run: |
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          Write-Host "Desempenho otimizado com sucesso."

      - name: Instalar e Configurar AnyDesk
        run: |
          # 1. Instala o AnyDesk
          choco install anydesk -y

          # 2. Caminho do AnyDesk
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          # 3. Define a Senha de Acesso Remoto (Definida para: Senha123456)
          $senha = "Senha123456"
          cmd /c "echo $senha | `"$anydeskPath`" --set-password"

          # 4. Inicia o serviço do AnyDesk
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue

          # 5. Obtém e exibe o ID no Log do GitHub
          Start-Sleep -Seconds 5
          $anydeskID = cmd /c "`"$anydeskPath`" --get-id"
          
          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host " ID DO ANYDESK : $anydeskID" -ForegroundColor Yellow
          Write-Host " SENHA        : $senha" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host ""

      - name: Manter Sistema Ativo e Monitorar
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          $tempoMaximo = 350 * 60 # 350 minutos (limite de 6 horas)
          $contador = 0

          while ($contador -lt $tempoMaximo) {$processo = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $processo) {
              Write-Host "Serviço do AnyDesk reiniciando..."
              Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
              Start-Process -FilePath $anydeskPath
            }
            Start-Sleep -Seconds 60
            $contador += 60
          }
          
