name: Windows Cloud PC - Windows App (Fix Ngrok)
on:
  workflow_dispatch:

jobs:
  build:
    name: Criando Cloud PC
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Otimizar Sistema e Desempenho
        run: |
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableCam /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 1 /f
          Write-Host "Otimizações aplicadas com sucesso."

      - name: 2. Habilitar RDP e Configurar Senha
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          $admin = [ADSI]"WinNT://./runneradmin,user"
          $admin.SetPassword("Senha123456!")
          Write-Host "RDP habilitado."

      - name: 3. Instalar Ngrok e Gerar Conexão
        env:
          # ATENÇÃO: COLE SUA CHAVE DO SITE NGROK.COM DENTRO DAS ASPAS ABAIXO
          NGROK_AUTH_TOKEN: "COLE_SEU_NGROK_TOKEN_AQUI"
        run: |
          if ($env:NGROK_AUTH_TOKEN -eq "3JywJKggw5jxSobqNRmS3yOVGyU_7fc9eRfLTowv6iyD5ffCR" -or -not $env:NGROK_AUTH_TOKEN) {
            Write-Host "===========================================================" -ForegroundColor Red
            Write-Host "ERRO: Você precisa colocar seu token do Ngrok na linha 31!" -ForegroundColor Red
            Write-Host "Crie uma conta gratuita em https://ngrok.com e pegue seu Authtoken." -ForegroundColor Red
            Write-Host "===========================================================" -ForegroundColor Red
            exit 1
          }

          # Instala o Ngrok de forma oficial via gerenciador de pacotes
          choco install ngrok -y

          # Configura e inicia o túnel RDP
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 10

          # Pega o endereço gerado para o Windows App
          $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $response.tunnels[0].public_url -replace "tcp://", ""

          Write-Host ""
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "   SISTEMA PRONTO PARA CONEXÃO NO WINDOWS APP!" -ForegroundColor Green
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host " PC NAME / ENDEREÇO : $publicUrl" -ForegroundColor Yellow
          Write-Host " USUÁRIO            : runneradmin" -ForegroundColor Yellow
          Write-Host " SENHA              : Senha123456!" -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host ""

      - name: 4. Manter PC Virtual Ligado
        run: |
          $tempoMaximo = 350 * 60
          $contador = 0
          while ($contador -lt $tempoMaximo) {
            Start-Sleep -Seconds 60
            $contador += 60
          }
          
